<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Picture Bee 🐝 2026</title>
<meta name="theme-color" content="#f5c842">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#fffbee;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;min-height:100vh}

/* Header */
.app-header{
  background:linear-gradient(135deg,#f5c842 0%,#f0a500 100%);
  padding:10px 16px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:20;
  box-shadow:0 3px 12px rgba(0,0,0,.15)
}
.app-title{font-size:20px;font-weight:900;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.2);letter-spacing:.5px}
.mode-tabs{display:flex;gap:6px}
.tab-btn{
  border:2px solid rgba(255,255,255,.6);background:rgba(255,255,255,.2);
  border-radius:20px;padding:6px 14px;font-weight:800;font-size:13px;
  cursor:pointer;color:#fff;transition:all .2s
}
.tab-btn.active{background:#fff;color:#c47f00}

/* Controls */
.controls{
  display:flex;gap:8px;align-items:center;padding:10px 16px;
  background:#fff8d6;border-bottom:2px solid #ffe680;flex-wrap:wrap
}
.ctrl-btn{
  border:0;border-radius:12px;padding:8px 16px;font-weight:800;font-size:13px;
  background:#f5c842;color:#5a3e00;cursor:pointer;transition:all .15s;
  box-shadow:0 2px 6px rgba(0,0,0,.1)
}
.ctrl-btn:active{transform:scale(0.95)}
.ctrl-btn.secondary{background:#e8e8e8;color:#444;box-shadow:none}
.voice-info{font-size:11px;color:#999;margin-left:auto}

/* Filter bar */
.filter-bar{
  display:flex;gap:6px;padding:8px 16px;background:#fffbee;
  border-bottom:1px solid #ffe680;overflow-x:auto;-webkit-overflow-scrolling:touch
}
.filter-btn{
  border:2px solid #f5c842;background:#fff;border-radius:16px;
  padding:5px 12px;font-size:12px;font-weight:700;color:#a07000;
  cursor:pointer;white-space:nowrap;transition:all .2s;flex-shrink:0
}
.filter-btn.active{background:#f5c842;color:#5a3e00}

/* Study grid */
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:14px;padding:16px;max-width:1100px;margin:0 auto
}

/* Card - honeycomb style matching the original */
.card{
  background:#fffde7;
  border-radius:16px;
  box-shadow:0 4px 16px rgba(0,0,0,.1);
  cursor:pointer;overflow:hidden;text-align:center;
  border:3px solid #f5c842;
  transition:all .2s;user-select:none;
  position:relative
}
.card:hover{transform:translateY(-4px);box-shadow:0 10px 28px rgba(0,0,0,.15);border-color:#f0a500}
.card:active{transform:scale(0.95)}
.card.speaking{border-color:#ff9800;box-shadow:0 0 0 4px rgba(255,152,0,.3)}

/* Card image area */
.card-img-wrap{
  width:100%;height:130px;
  display:flex;align-items:center;justify-content:center;
  background:#fffde7;padding:8px;position:relative;overflow:hidden
}
.card-img-wrap img{
  max-width:100%;max-height:114px;object-fit:contain;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.15))
}
/* Fallback emoji when image not found */
.card-img-wrap .fallback-emoji{
  font-size:60px;line-height:1
}

/* Card label */
.card-lbl{
  padding:7px 8px 10px;
  font-weight:900;font-size:13px;color:#5a3e00;
  text-transform:capitalize;letter-spacing:.3px;
  background:linear-gradient(180deg,#fff8cc 0%,#ffee80 100%);
  border-top:2px solid #f5c842
}

/* Category badge */
.cat-badge{
  position:absolute;top:4px;left:4px;
  background:rgba(245,200,66,.85);
  border-radius:8px;padding:2px 6px;
  font-size:9px;font-weight:800;color:#5a3e00;letter-spacing:.3px
}

/* Memory game */
.mem-info{
  display:flex;gap:16px;padding:10px 16px;background:#fff8d6;
  font-size:13px;color:#666;align-items:center;
  border-bottom:2px solid #ffe680;flex-wrap:wrap
}
.stat-pill{background:#f5c842;border-radius:12px;padding:4px 10px;font-weight:800;color:#5a3e00}
.mem-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  gap:10px;padding:14px;max-width:960px;margin:0 auto
}
.mem-card{height:130px;perspective:700px;cursor:pointer}
.mem-inner{
  width:100%;height:100%;position:relative;
  transform-style:preserve-3d;transition:transform .45s cubic-bezier(.4,0,.2,1)
}
.mem-inner.flipped,.mem-inner.matched{transform:rotateY(180deg)}
.mem-face{
  position:absolute;width:100%;height:100%;
  backface-visibility:hidden;border-radius:16px;
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;border:3px solid transparent;overflow:hidden
}
.mem-back{
  background:linear-gradient(135deg,#f5c842,#f0a500);
  border-color:#d4900a
}
.mem-back-content{font-size:40px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.2))}
.mem-front{background:#fffde7;border-color:#f5c842;transform:rotateY(180deg)}
.mem-front.matched-face{background:#e8f5e9;border-color:#81c784}
.mem-front img{max-width:80%;max-height:72px;object-fit:contain;margin-bottom:4px}
.mem-front .fallback-emoji{font-size:44px;margin-bottom:2px}
.mem-word{font-size:11px;font-weight:900;color:#5a3e00;text-transform:capitalize;text-align:center;padding:0 4px}

/* Progress & win */
.progress-bar{height:6px;background:#f0e0a0;margin:0 16px 0}
.progress-fill{height:100%;background:linear-gradient(90deg,#66bb6a,#43a047);border-radius:3px;transition:width .6s}
.win-banner{
  text-align:center;padding:28px;font-size:22px;font-weight:900;
  color:#2e7d32;background:#e8f5e9;border-radius:18px;
  margin:16px;border:3px solid #81c784
}
.hidden{display:none}

/* Scrollbar for filter bar */
.filter-bar::-webkit-scrollbar{height:3px}
.filter-bar::-webkit-scrollbar-thumb{background:#f5c842;border-radius:3px}
</style>
</head>
<body>

<div class="app-header">
  <div class="app-title">🐝 Picture Bee 2026</div>
  <div class="mode-tabs">
    <button class="tab-btn active" id="tab-study" onclick="setMode('study')">📚 Estudo</button>
    <button class="tab-btn" id="tab-memory" onclick="setMode('memory')">🎮 Memória</button>
  </div>
</div>

<!-- STUDY MODE -->
<div id="study-panel">
  <div class="controls">
    <button class="ctrl-btn" onclick="shuffleStudy()">🔀 Embaralhar</button>
    <button class="ctrl-btn secondary" onclick="resetStudy()">↺ A–Z</button>
    <span class="voice-info" id="voiceInfo">carregando voz...</span>
  </div>
  <div class="filter-bar" id="filter-bar"></div>
  <div id="study-grid" class="grid"></div>
</div>

<!-- MEMORY MODE -->
<div id="memory-panel" class="hidden">
  <div class="controls">
    <button class="ctrl-btn" onclick="startMemory()">▶ Nova partida</button>
    <select id="mem-size" style="border-radius:10px;padding:7px 10px;border:2px solid #f5c842;
      font-weight:800;font-size:13px;background:#fff;color:#5a3e00">
      <option value="6">Fácil – 6 pares</option>
      <option value="10" selected>Médio – 10 pares</option>
      <option value="18">Difícil – 18 pares</option>
    </select>
    <select id="mem-cat" style="border-radius:10px;padding:7px 10px;border:2px solid #f5c842;
      font-weight:800;font-size:13px;background:#fff;color:#5a3e00">
      <option value="all">Todas as categorias</option>
    </select>
    <span class="voice-info" id="mem-voice-info"></span>
  </div>
  <div class="mem-info">
    <span>✅ Pares: <span class="stat-pill" id="pairsFound">0</span> / <span id="pairsTotal">10</span></span>
    <span>🎯 Tentativas: <span class="stat-pill" id="attempts">0</span></span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  <div id="win-banner" class="win-banner hidden">🎉 Parabéns! Você encontrou todos os pares! 🏆<br><span style="font-size:16px;font-weight:700">Clique em "Nova partida" para jogar de novo!</span></div>
  <div id="mem-grid" class="mem-grid"></div>
</div>

<script>
// ================================================================
// LISTA COMPLETA DE CARTÕES
// img: nome do arquivo dentro da pasta images/ (sem a pasta)
// word: palavra em inglês
// cat: categoria (para filtro)
// fallback: emoji caso a imagem não carregue
// ================================================================
const ALL_CARDS = [
  // ANIMAIS
  {word:'giraffe',      img:'giraffe.png',         cat:'Animals',    fb:'🦒'},
  {word:'elephant',     img:'elephant.png',         cat:'Animals',    fb:'🐘'},
  {word:'ostrich',      img:'ostrich.png',          cat:'Animals',    fb:'🦢'},
  {word:'bear',         img:'bear.png',             cat:'Animals',    fb:'🐻'},
  {word:'moose',        img:'moose.png',            cat:'Animals',    fb:'🫎'},
  {word:'chameleon',    img:'chameleon.png',        cat:'Animals',    fb:'🦎'},

  // HIGIENE
  {word:'toothbrush',   img:'toothbrush.png',       cat:'Hygiene',    fb:'🪥'},
  {word:'toothpaste',   img:'toothpaste.png',       cat:'Hygiene',    fb:'🦷'},

  // NÚMEROS
  {word:'eleven',       img:'eleven.png',           cat:'Numbers',    fb:'1️⃣1️⃣'},
  {word:'twelve',       img:'twelve.png',           cat:'Numbers',    fb:'1️⃣2️⃣'},
  {word:'thirteen',     img:'thirteen.png',         cat:'Numbers',    fb:'1️⃣3️⃣'},
  {word:'fourteen',     img:'fourteen.png',         cat:'Numbers',    fb:'1️⃣4️⃣'},
  {word:'fifteen',      img:'fifteen.png',          cat:'Numbers',    fb:'1️⃣5️⃣'},
  {word:'twenty',       img:'twenty.png',           cat:'Numbers',    fb:'2️⃣0️⃣'},

  // ESCOLA
  {word:'pencil',       img:'pencil.png',           cat:'School',     fb:'✏️'},
  {word:'pen',          img:'pen.png',              cat:'School',     fb:'🖊️'},
  {word:'eraser',       img:'eraser.png',           cat:'School',     fb:'🧹'},
  {word:'colored pencils', img:'colored_pencils.png', cat:'School',  fb:'🖍️'},
  {word:'book',         img:'book.png',             cat:'School',     fb:'📚'},
  {word:'school bag',   img:'school_bag.png',       cat:'School',     fb:'🎒'},
  {word:'classroom',    img:'classroom.png',        cat:'School',     fb:'🏫'},

  // MATERIAIS
  {word:'stone',        img:'stone.png',            cat:'Materials',  fb:'🪨'},
  {word:'metal',        img:'metal.png',            cat:'Materials',  fb:'⚙️'},
  {word:'hot',          img:'hot.png',              cat:'Materials',  fb:'🔥'},
  {word:'cold',         img:'cold.png',             cat:'Materials',  fb:'❄️'},

  // APARÊNCIA
  {word:'curly',        img:'curly.png',            cat:'Appearance', fb:'🌀'},
  {word:'straight',     img:'straight.png',         cat:'Appearance', fb:'➡️'},

  // FAMÍLIA
  {word:'baby',         img:'baby.png',             cat:'Family',     fb:'👶'},
  {word:'family',       img:'family.png',           cat:'Family',     fb:'👨‍👩‍👧‍👦'},
  {word:'grandfather',  img:'grandfather.png',      cat:'Family',     fb:'👴'},
  {word:'grandmother',  img:'grandmother.png',      cat:'Family',     fb:'👵'},
  {word:'father',       img:'father.png',           cat:'Family',     fb:'👨'},
  {word:'mother',       img:'mother.png',           cat:'Family',     fb:'👩'},
  {word:'sister',       img:'sister.png',           cat:'Family',     fb:'👧'},
  {word:'brother',      img:'brother.png',          cat:'Family',     fb:'👦'},
  {word:'child',        img:'child.png',            cat:'Family',     fb:'🧒'},
  {word:'adult',        img:'adult.png',            cat:'Family',     fb:'🧑'},
  {word:'elderly',      img:'elderly.png',          cat:'Family',     fb:'🧓'},

  // CORPO
  {word:'head',         img:'head.png',             cat:'Body',       fb:'🗣️'},
  {word:'shoulder',     img:'shoulder.png',         cat:'Body',       fb:'🤷'},
  {word:'knee',         img:'knee.png',             cat:'Body',       fb:'🦵'},
  {word:'toes',         img:'toes.png',             cat:'Body',       fb:'🦶'},
  {word:'eye',          img:'eye.png',              cat:'Body',       fb:'👁️'},
  {word:'ear',          img:'ear.png',              cat:'Body',       fb:'👂'},
  {word:'mouth',        img:'mouth.png',            cat:'Body',       fb:'👄'},
  {word:'nose',         img:'nose.png',             cat:'Body',       fb:'👃'},
  {word:'neck',         img:'neck.png',             cat:'Body',       fb:'🫀'},
  {word:'elbow',        img:'elbow.png',            cat:'Body',       fb:'💪'},
  {word:'wrist',        img:'wrist.png',            cat:'Body',       fb:'⌚'},
  {word:'finger',       img:'finger.png',           cat:'Body',       fb:'☝️'},
  {word:'ankle',        img:'ankle.png',            cat:'Body',       fb:'🦶'},
  {word:'skin',         img:'skin.png',             cat:'Body',       fb:'🧖'},
  {word:'blood',        img:'blood.png',            cat:'Body',       fb:'🩸'},
  {word:'bone',         img:'bone.png',             cat:'Body',       fb:'🦴'},

  // SENTIDOS
  {word:'vision',       img:'vision.png',           cat:'Senses',     fb:'👁️'},
  {word:'taste',        img:'taste.png',            cat:'Senses',     fb:'👅'},
  {word:'hearing',      img:'hearing.png',          cat:'Senses',     fb:'👂'},
  {word:'touch',        img:'touch.png',            cat:'Senses',     fb:'🤌'},
  {word:'smell',        img:'smell.png',            cat:'Senses',     fb:'👃'},

  // EMOÇÕES
  {word:'happy',        img:'happy.png',            cat:'Emotions',   fb:'😊'},
  {word:'angry',        img:'angry.png',            cat:'Emotions',   fb:'😠'},
  {word:'sad',          img:'sad.png',              cat:'Emotions',   fb:'😢'},
  {word:'afraid',       img:'afraid.png',           cat:'Emotions',   fb:'😨'},

  // CORES
  {word:'black',        img:'black.png',            cat:'Colors',     fb:'⬛'},
  {word:'purple',       img:'purple.png',           cat:'Colors',     fb:'🟣'},
  {word:'pink',         img:'pink.png',             cat:'Colors',     fb:'🩷'},
  {word:'green',        img:'green.png',            cat:'Colors',     fb:'🟢'},
  {word:'blue',         img:'blue.png',             cat:'Colors',     fb:'🔵'},
  {word:'orange',       img:'orange.png',           cat:'Colors',     fb:'🟠'},

  // OUTROS
  {word:'cross',        img:'cross.png',            cat:'Other',      fb:'✝️'},
];

// ================================================================
// VOICE
// ================================================================
let enVoice = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  enVoice = vs.find(v=>v.lang==='en-US')
           || vs.find(v=>v.lang==='en-GB')
           || vs.find(v=>v.lang&&v.lang.toLowerCase().startsWith('en'));
  const name = enVoice ? enVoice.name.split(' ').slice(0,4).join(' ') : 'Sem voz EN';
  document.getElementById('voiceInfo').textContent = 'Voz: ' + name;
  document.getElementById('mem-voice-info').textContent = 'Voz: ' + name;
}
pickVoice();
if(typeof speechSynthesis !== 'undefined') speechSynthesis.onvoiceschanged = pickVoice;

function speak(word){
  try{
    const u = new SpeechSynthesisUtterance(word);
    u.lang = 'en-US';
    if(enVoice) u.voice = enVoice;
    u.rate = 0.82; u.pitch = 1.0;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }catch(e){}
}

// ================================================================
// STUDY MODE
// ================================================================
let studyList = [...ALL_CARDS];
let activeCategory = 'All';

// Build filter buttons
function buildFilters(){
  const cats = ['All', ...new Set(ALL_CARDS.map(c=>c.cat))];
  const bar = document.getElementById('filter-bar');
  bar.innerHTML = '';
  cats.forEach(cat => {
    const b = document.createElement('button');
    b.className = 'filter-btn' + (cat === 'All' ? ' active' : '');
    b.textContent = catLabel(cat);
    b.onclick = () => {
      activeCategory = cat;
      bar.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      applyFilter();
    };
    bar.appendChild(b);
  });

  // Also populate memory category select
  const sel = document.getElementById('mem-cat');
  cats.forEach(cat => {
    const o = document.createElement('option');
    o.value = cat; o.textContent = catLabel(cat);
    sel.appendChild(o);
  });
}

function catLabel(cat){
  const labels = {
    All:'🐝 Todas', Animals:'🐾 Animais', Hygiene:'🪥 Higiene',
    Numbers:'🔢 Números', School:'✏️ Escola', Materials:'🪨 Materiais',
    Appearance:'💇 Aparência', Family:'👨‍👩‍👧 Família', Body:'🫀 Corpo',
    Senses:'👁️ Sentidos', Emotions:'😊 Emoções', Colors:'🎨 Cores', Other:'➕ Outros'
  };
  return labels[cat] || cat;
}

function applyFilter(){
  studyList = activeCategory === 'All'
    ? [...ALL_CARDS]
    : ALL_CARDS.filter(c => c.cat === activeCategory);
  renderStudy();
}

function makeCardImg(c, size){
  // size: 'study' or 'mem'
  const img = document.createElement('img');
  img.src = 'images/' + c.img;
  img.alt = c.word;
  img.loading = 'lazy';
  img.onerror = function(){
    this.style.display = 'none';
    const span = document.createElement('span');
    span.className = 'fallback-emoji';
    span.textContent = c.fb || '🔤';
    this.parentNode.insertBefore(span, this);
  };
  return img;
}

function renderStudy(){
  const g = document.getElementById('study-grid');
  g.innerHTML = '';
  studyList.forEach(c => {
    const el = document.createElement('div');
    el.className = 'card';

    const wrap = document.createElement('div');
    wrap.className = 'card-img-wrap';
    wrap.appendChild(makeCardImg(c));

    const lbl = document.createElement('div');
    lbl.className = 'card-lbl';
    lbl.textContent = c.word;

    el.appendChild(wrap);
    el.appendChild(lbl);

    el.onclick = () => {
      speak(c.word);
      el.classList.add('speaking');
      setTimeout(() => el.classList.remove('speaking'), 800);
    };
    g.appendChild(el);
  });
}

function shuffleStudy(){
  const arr = [...studyList];
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  studyList = arr;
  renderStudy();
}

function resetStudy(){
  applyFilter();
}

// ================================================================
// MEMORY GAME
// ================================================================
let memCards=[], flipped=[], matched=[], attempts=0, lock=false;

function startMemory(){
  const n   = parseInt(document.getElementById('mem-size').value);
  const cat = document.getElementById('mem-cat').value;

  document.getElementById('pairsTotal').textContent = n;
  document.getElementById('pairsFound').textContent = 0;
  document.getElementById('attempts').textContent = 0;
  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('win-banner').classList.add('hidden');
  attempts=0; flipped=[]; matched=[]; lock=false;

  let pool = cat === 'All' ? [...ALL_CARDS] : ALL_CARDS.filter(c=>c.cat===cat);
  if(pool.length < n) pool = [...ALL_CARDS]; // fallback
  pool = pool.sort(()=>Math.random()-.5).slice(0, n);

  memCards = [
    ...pool.map((c,i)=>({...c, uid:'a'+i})),
    ...pool.map((c,i)=>({...c, uid:'b'+i}))
  ].sort(()=>Math.random()-.5);

  renderMemory();
}

function renderMemory(){
  const g = document.getElementById('mem-grid');
  g.innerHTML = '';
  memCards.forEach(c => {
    const wrap = document.createElement('div');
    wrap.className = 'mem-card';

    const inner = document.createElement('div');
    inner.className = 'mem-inner';
    inner.id = 'inner-' + c.uid;

    // Back face
    const back = document.createElement('div');
    back.className = 'mem-face mem-back';
    back.innerHTML = '<div class="mem-back-content">🐝</div>';

    // Front face
    const front = document.createElement('div');
    front.className = 'mem-face mem-front';
    front.id = 'front-' + c.uid;

    const img = makeCardImg(c);
    const wordEl = document.createElement('div');
    wordEl.className = 'mem-word';
    wordEl.textContent = c.word;

    front.appendChild(img);
    front.appendChild(wordEl);

    inner.appendChild(back);
    inner.appendChild(front);
    wrap.appendChild(inner);
    wrap.onclick = () => flipCard(c);
    g.appendChild(wrap);
  });
}

function flipCard(c){
  if(lock) return;
  if(flipped.find(f=>f.uid===c.uid)) return;
  if(matched.includes(c.word)) return;
  document.getElementById('inner-'+c.uid).classList.add('flipped');
  speak(c.word);
  flipped.push(c);
  if(flipped.length===2){
    attempts++;
    document.getElementById('attempts').textContent = attempts;
    lock = true;
    setTimeout(checkMatch, 1100);
  }
}

function checkMatch(){
  const [a,b] = flipped;
  if(a.word === b.word){
    matched.push(a.word);
    [a.uid, b.uid].forEach(uid=>{
      const el = document.getElementById('front-'+uid);
      if(el) el.classList.add('matched-face');
    });
    const n = parseInt(document.getElementById('mem-size').value);
    document.getElementById('pairsFound').textContent = matched.length;
    document.getElementById('progressFill').style.width = (matched.length/n*100)+'%';
    if(matched.length === n){
      setTimeout(()=>document.getElementById('win-banner').classList.remove('hidden'), 500);
    }
  } else {
    flipped.forEach(f=>document.getElementById('inner-'+f.uid).classList.remove('flipped'));
  }
  flipped = []; lock = false;
}

// ================================================================
// MODE SWITCHING
// ================================================================
function setMode(mode){
  document.getElementById('tab-study').classList.toggle('active', mode==='study');
  document.getElementById('tab-memory').classList.toggle('active', mode==='memory');
  document.getElementById('study-panel').classList.toggle('hidden', mode!=='study');
  document.getElementById('memory-panel').classList.toggle('hidden', mode!=='memory');
  if(mode==='memory') startMemory();
}

// ================================================================
// INIT
// ================================================================
buildFilters();
applyFilter();
